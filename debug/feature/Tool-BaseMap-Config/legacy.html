<!DOCTYPE html>
<html>
    <head>
        <title>Legacy</title>

        <script src="../../../dist/smk.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css"/>
    </head>
    <body>
        <script src="map-config.js"></script>
<!--***************************************************************************
    This example shows the default configuration for zoom tool.
-->
    <div id="smk-map-frame"></div>
    <script>
        SMK.INIT( {
            containerSel: '#smk-map-frame',
            config: mapConfig( {
                tools: [
                    {
                        type: 'baseMaps',
                        choices: [
                            'topographic',
                            'streets',
                            'imagery',
                            'oceans',
                            'nationalGeographic',
                            'shadedRelief',
                            'darkGray',
                            'gray',
                        ],
                        mapStyle: {
                            width: '240px',
                            height: '80px'
                        }
                    }
                ]
            } )
        } )
    </script>
<!--***************************************************************************-->
    </body>
</html>
