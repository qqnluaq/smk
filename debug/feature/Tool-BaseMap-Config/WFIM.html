<!DOCTYPE html>
<html>
    <head>
        <title>WFIM</title>

        <script src="../../../dist/smk.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css"/>
    </head>
    <body>
        <script src="map-config.js"></script>
<!--***************************************************************************
    This example shows the default configuration for zoom tool.
-->
    <div id="smk-map-frame"></div>
    <script>
        SMK.INIT( {
            containerSel: '#smk-map-frame',
            config: mapConfig( {
                viewer: {
                    baseMap: 'bc-basemap',
                    baseMapConfig: [
                        { 
                            id: 'bc-basemap',
                            optionImageUrl: 'basemaps/bc-basemap.png',
                            title: 'BCGOV - BC'
                        },
                        { 
                            id: 'bc-basemap-hillshade',
                            optionImageUrl: 'basemaps/bc-basemap-hillshade.png',
                            title: 'BCGOV - BC (Hillshade)'
                        },
                        { 
                            id: 'topographic-v2',
                            optionImageUrl: 'basemaps/topographic-v2.png',
                            title: 'ESRI - Topographic'
                        },
                        { 
                            id: 'imagery-v2',
                            optionImageUrl: 'basemaps/imagery-v2.png',
                            title: 'ESRI - Imagery'
                        },
                        { 
                            id: 'streets-v2',
                            optionImageUrl: 'basemaps/streets-v2.png',
                            title: 'ESRI - Streets'
                        },
                        { 
                            id: 'streets-night',	
                            optionImageUrl: 'basemaps/streets-night.png',
                            title: 'ESRI - Streets (Night)'
                        },
                        { 
                            id: 'oceans-v2',
                            optionImageUrl: 'basemaps/oceans-v2.png',
                            title: 'ESRI - Oceans'
                        },
                        { 
                            id: 'national-geographic-v2',
                            optionImageUrl: 'basemaps/national-geographic-v2.png',
                            title: 'ESRI - National Geographic'
                        },
                        { 
                            id: 'light-gray-v2',
                            optionImageUrl: 'basemaps/light-gray-v2.png',
                            title: 'ESRI - Light Grey'
                        },
                    ]
                },
                tools: [
                    {
                        type: 'baseMaps',
                        choices: [
                            'bc-basemap',
                            'bc-basemap-hillshade',
                            'topographic-v2',
                            'imagery-v2',
                            'streets-v2',
                            'streets-night',	
                            'oceans-v2',
                            'national-geographic-v2',
                            'light-gray-v2',
                        ],
                        mapStyle: {
                            width: '240px',
                            height: '80px'
                        }
                    }
                ]
            } )
        } )
    </script>
<!--***************************************************************************-->
    </body>
</html>
