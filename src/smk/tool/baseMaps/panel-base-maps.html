<tool-panel class="smk-base-maps-panel" 
    v-bind="$$projectProps( 'tool-panel' )"
>
    <template slot="header">
        <slot></slot>
    </template>

    <div class="smk-base-map"  
        v-on:click="$$emit( 'set-base-map', { id: 'Topographic' } )" 
        v-bind:class="{ 'smk-active': 'Topographic' == current }"
    >
        <div>Topographic</div>
        <img v-bind:src="imageTopographic"></img>
    </div>

    <div class="smk-base-map"  
        v-on:click="$$emit( 'set-base-map', { id: 'Imagery' } )" 
        v-bind:class="{ 'smk-active': 'Imagery' == current }"
    >
        <div>Imagery</div>
        <img v-bind:src="imageImagery"></img>
    </div>

    <div class="smk-base-map"  
        v-on:click="$$emit( 'set-base-map', { id: 'Streets' } )" 
        v-bind:class="{ 'smk-active': 'Streets' == current }"
    >
        <div>Streets</div>
        <img v-bind:src="imageStreets"></img>
    </div>
</tool-panel>
